apply plugin: 'com.android.library'
apply from: 'maven-push.gradle'

android {
    namespace 'gleap.io.gleap'

    compileSdkVersion 33

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 33
        // The SDK version reported in env data and requests, from VERSION_NAME in gradle.properties.
        buildConfigField "String", "VERSION_NAME", "\"${VERSION_NAME}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }

    testOptions {
        // Local unit tests run against android.jar stubs: Android calls on code paths under test
        // (e.g. android.util.Log) return default values instead of throwing.
        unitTests.returnDefaultValues = true
    }

    // Expose the release variant for publishing
    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}


dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    // android.jar only ships org.json stubs for local unit tests.
    testImplementation 'org.json:json:20250107'
}
