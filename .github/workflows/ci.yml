name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and release build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # v5 on purpose: v6 moved caching into a proprietary component with separate terms of use.
      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests and assembleRelease
        run: ./gradlew :gleap:testDebugUnitTest :gleap:assembleRelease
